name: Build and Push Docker Image

on:
  push:
    branches: [master]

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claudecode:
    uses: ./.github/workflows/build-image.yml
    with:
      targets: claudecode
      image: nbr23/claudecode
    secrets: inherit

  antigravity:
    uses: ./.github/workflows/build-image.yml
    with:
      targets: antigravity
      image: nbr23/antigravity
    secrets: inherit
